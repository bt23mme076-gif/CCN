# Cloudflare fronts every operator subdomain, so $remote_addr is a Cloudflare
# edge IP unless we tell nginx to trust CF-Connecting-IP. Refresh this list
# from https://www.cloudflare.com/ips/ if Cloudflare ever changes it.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
real_ip_header CF-Connecting-IP;

# Shared proxy settings for the Next.js container.
# $host is passed through untouched — middleware.ts derives the operator from
# it, so rewriting it here would break tenant resolution.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_http_version 1.1;
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection 'upgrade';
proxy_read_timeout 60s;

# Plain HTTP: send everything to HTTPS.
server {
    listen 80 default_server;
    server_name atyant.in *.atyant.in;
    return 301 https://$host$request_uri;
}

# Any hostname we do not serve gets closed rather than silently answered
# by whichever server block happens to be first.
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/atyant.in.pem;
    ssl_certificate_key /etc/nginx/certs/atyant.in.key;

    return 444;
}

# Apex plus every operator subdomain: ccn.atyant.in, op2.atyant.in, ...
# New operators need no nginx change — only a row in the operators table.
server {
    listen 443 ssl;
    http2 on;
    server_name atyant.in *.atyant.in;

    # Cloudflare Origin Certificate, issued for both atyant.in and *.atyant.in.
    ssl_certificate     /etc/nginx/certs/atyant.in.pem;
    ssl_certificate_key /etc/nginx/certs/atyant.in.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Recharge receipts and plan lists stay small; payment callbacks do not.
    client_max_body_size 10m;

    location / {
        proxy_pass         http://app:3000;
        proxy_cache_bypass $http_upgrade;
    }

    # Auth and payment responses must never be served stale.
    location /api/ {
        proxy_pass http://app:3000;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
