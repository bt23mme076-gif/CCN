<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Sample advertiser banner for the /advertise page TV preview.
       Key content sits in the LEFT strip and BOTTOM strip so it reads the same
       in Full Screen and L-Shape (where the top-right 76%x80% shows the live
       program). The top-right corner is kept clear for the CCN LIVE logo. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c2d12"/>
      <stop offset="0.5" stop-color="#b91c1c"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1300" cy="300" r="320" fill="#fff" opacity="0.07"/>

  <!-- Centre / right (visible only in Full Screen) -->
  <text x="1180" y="420" text-anchor="middle" font-family="Georgia, serif" font-size="150" font-weight="700" fill="#fff">Sharma</text>
  <text x="1180" y="580" text-anchor="middle" font-family="Georgia, serif" font-size="150" font-weight="700" fill="url(#gold)">Electronics</text>
  <text x="1180" y="680" text-anchor="middle" font-family="Arial, sans-serif" font-size="56" fill="#fff" opacity="0.9">TV • Fridge • AC • Mobiles</text>

  <!-- Left strip (visible in both) -->
  <rect x="0" y="0" width="460" height="864" fill="#000" opacity="0.25"/>
  <text x="230" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="64" font-weight="700" fill="#fde68a">FESTIVE</text>
  <text x="230" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="64" font-weight="700" fill="#fde68a">SALE</text>
  <text x="230" y="500" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="150" font-weight="900" fill="#fff">30%</text>
  <text x="230" y="590" text-anchor="middle" font-family="Arial, sans-serif" font-size="70" font-weight="700" fill="#fff">OFF</text>
  <text x="230" y="720" text-anchor="middle" font-family="Georgia, serif" font-size="52" font-weight="700" fill="#fff">Sharma</text>
  <text x="230" y="780" text-anchor="middle" font-family="Georgia, serif" font-size="52" font-weight="700" fill="#fde68a">Electronics</text>

  <!-- Bottom strip (visible in both) — content kept above the lowest ~8%,
       where the optional scrolling-text ticker runs. -->
  <rect x="0" y="864" width="1920" height="216" fill="#111827" opacity="0.85"/>
  <text x="80" y="955" font-family="Arial, sans-serif" font-size="64" font-weight="700" fill="#fff">Main Market  |  Call 98XXX XXXXX</text>
  <rect x="1440" y="884" width="400" height="104" rx="52" fill="url(#gold)"/>
  <text x="1640" y="953" text-anchor="middle" font-family="Arial, sans-serif" font-size="50" font-weight="800" fill="#7c2d12">VISIT TODAY</text>
</svg>
