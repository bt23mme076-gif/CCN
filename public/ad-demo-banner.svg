<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Sample advertiser banner for the /advertise page TV preview.
       Content sits in the right strip and bottom strip so it reads the same
       in Full Screen and L-Shape (where the top-left 76%x80% is covered). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c2d12"/>
      <stop offset="0.5" stop-color="#b91c1c"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1700" cy="200" r="260" fill="#fff" opacity="0.08"/>
  <circle cx="300" cy="1000" r="300" fill="#000" opacity="0.12"/>

  <!-- Left / centre (visible in Full Screen) -->
  <text x="110" y="300" font-family="Georgia, serif" font-size="150" font-weight="700" fill="#fff">Sharma</text>
  <text x="110" y="460" font-family="Georgia, serif" font-size="150" font-weight="700" fill="url(#gold)">Electronics</text>
  <text x="115" y="560" font-family="Arial, sans-serif" font-size="56" fill="#fff" opacity="0.9">TV • Fridge • AC • Mobiles</text>

  <!-- Right strip (visible in both) -->
  <rect x="1480" y="0" width="440" height="864" fill="#000" opacity="0.25"/>
  <text x="1700" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="64" font-weight="700" fill="#fde68a">FESTIVE</text>
  <text x="1700" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="64" font-weight="700" fill="#fde68a">SALE</text>
  <text x="1700" y="520" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="150" font-weight="900" fill="#fff">30%</text>
  <text x="1700" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="70" font-weight="700" fill="#fff">OFF</text>

  <!-- Bottom strip (visible in both) -->
  <rect x="0" y="864" width="1920" height="216" fill="#111827" opacity="0.85"/>
  <text x="80" y="990" font-family="Arial, sans-serif" font-size="68" font-weight="700" fill="#fff">Main Market  |  Call 98XXX XXXXX</text>
  <rect x="1440" y="905" width="400" height="130" rx="65" fill="url(#gold)"/>
  <text x="1640" y="990" text-anchor="middle" font-family="Arial, sans-serif" font-size="56" font-weight="800" fill="#7c2d12">VISIT TODAY</text>
</svg>
